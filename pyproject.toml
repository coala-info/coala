[project]
name = "coala-cli"
version = "0.2.4"
description = "Command-line LLM-agent Adapter"
authors = [{ name = "Qiang" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.15"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi>=0.115.0",
    "requests>=2.33.0,<3.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "uvicorn>=0.32.0,<0.33.0",
    "cwltool>=3.2.20260413085819,<4.0.0",
    "mcp>=1.12.0,<2.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The sdist carries what the Poetry build did: the package and the README.
[tool.hatch.build.targets.sdist]
include = ["coala", "README.md"]

[tool.hatch.build.targets.wheel]
packages = ["coala"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::pydantic.warnings.UnsupportedFieldAttributeWarning",
]
