[tool.poetry]
name = "coala-cli"
version = "0.2.1"
description = "Command-line LLM-agent Adapter"
authors = ["Qiang"]
license = "MIT"
readme = "README.md"
packages = [{ include = "coala" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
fastapi = ">=0.115.0"
requests = "^2.33.0"
pydantic = "^2.10.0"
uvicorn = "^0.32.0"
cwltool = "^3.2.20260413085819"
mcp = "^1.12.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::pydantic.warnings.UnsupportedFieldAttributeWarning",
]
